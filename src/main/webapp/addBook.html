<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">


    <style>

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #182848;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: white;
            padding: 15px 35px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
        }


        .brand {
            font-size: 25px;
            font-weight: bold;
            color: #182848;
            text-decoration: none;
        }


        .brand i {
            color: #4b6cb7;
            margin-right: 8px;
        }


        .back-btn {
            border-radius: 10px;
            font-weight: 600;
        }


        /* =========================
           MAIN
        ========================= */

        .main-container {
            max-width: 950px;
            margin: 40px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            background: linear-gradient(135deg, #182848, #4b6cb7);
            color: white;

            border-radius: 22px;

            padding: 35px;

            margin-bottom: 30px;

            box-shadow: 0 12px 30px rgba(75, 108, 183, 0.18);
        }


        .page-header h1 {
            font-weight: bold;
            margin-bottom: 8px;
        }


        .page-header p {
            margin: 0;
            color: #e5e7eb;
        }


        .header-icon {
            font-size: 75px;
            opacity: 0.18;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: white;

            border-radius: 22px;

            padding: 40px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }


        .section-title {
            font-size: 20px;
            font-weight: bold;

            color: #182848;

            margin-bottom: 25px;
        }


        .form-label {
            font-weight: 600;
            color: #374151;
        }


        .form-control,
        .form-select {
            height: 50px;
            border-radius: 11px;
            border: 1px solid #d1d5db;
        }


        .form-control:focus,
        .form-select:focus {

            border-color: #4b6cb7;

            box-shadow:
                0 0 0 3px rgba(75, 108, 183, 0.15);
        }


        /* =========================
           INPUT ICON
        ========================= */

        .input-group-text {
            background: white;
            border-radius: 11px 0 0 11px;
        }


        .input-group .form-control {
            border-radius: 0 11px 11px 0;
        }


        /* =========================
           IMAGE UPLOAD
        ========================= */

        .image-upload {

            border: 2px dashed #cbd5e1;

            border-radius: 15px;

            padding: 30px;

            text-align: center;

            background: #f8fafc;

            transition: 0.3s;
        }


        .image-upload:hover {

            border-color: #4b6cb7;

            background: #f1f5ff;
        }


        .upload-icon {

            font-size: 45px;

            color: #4b6cb7;

            margin-bottom: 10px;
        }


        .image-upload p {

            color: #6b7280;

            margin-bottom: 15px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .submit-btn {

            height: 52px;

            border-radius: 12px;

            background: #4b6cb7;

            border: none;

            font-weight: bold;

            padding: 0 30px;
        }


        .submit-btn:hover {

            background: #3b5998;
        }


        .reset-btn {

            height: 52px;

            border-radius: 12px;

            padding: 0 30px;

            font-weight: 600;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            color: #6b7280;

            padding: 25px;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 768px) {

            .navbar {
                padding: 15px 20px;
            }

            .main-container {
                margin: 25px 15px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .page-header {
                padding: 25px;
            }

            .header-icon {
                display: none;
            }

        }

    </style>
</head>
<body>
<nav class="navbar">

    <div class="container-fluid">

        <!-- LOGO -->

        <a href="login_success.jsp"
           class="brand">

            <i class="bi bi-book-half"></i>

            BookVault

        </a>


        <!-- BACK -->

        <a href="login_success.jsp"
           class="btn btn-outline-primary back-btn">

            <i class="bi bi-arrow-left me-2"></i>

            Dashboard

        </a>

    </div>

</nav>
    <form action="book" method="post">
        <div class="container main-container">
            <div class="page-header">

                <div class="row align-items-center">

                    <div class="col-md-9">

                        <p class="fw-semibold mb-2">

                            BOOK MANAGEMENT

                        </p>

                        <h1>

                            Add New Book

                        </h1>

                        <p>

                            Enter the book details below to add
                            a new book to your library.

                        </p>

                    </div>


                    <div class="col-md-3 text-center">

                        <i class="bi bi-journal-plus header-icon"></i>

                    </div>

                </div>

            </div>

            <div class="form-card">


                <h3 class="section-title">

                    <i class="bi bi-info-circle me-2"></i>

                    Book Information

                </h3>
                    <div class="row g-4">

                        <div class="col-md-6">

                            <label class="form-label">

                                Book ID

                            </label>


                            <div class="input-group">

                        <span class="input-group-text">

                            📑

                        </span>


                                <input type="text"
                                       class="form-control"
                                       placeholder="Enter book ID" name="code">

                            </div>

                        </div>
                        <div class="col-md-6">

                            <label class="form-label">

                                Book Name

                            </label>


                            <div class="input-group">

                        <span class="input-group-text">

                            📙

                        </span>


                                <input type="text"
                                       class="form-control"
                                       placeholder="Enter book name" name="name">

                            </div>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Author Name

                            </label>


                            <div class="input-group">

                        <span class="input-group-text">

                           👦

                        </span>


                                <input type="text"
                                       class="form-control"
                                       placeholder="Enter author name" name="author">

                            </div>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Price

                            </label>


                            <div class="input-group">

                        <span class="input-group-text">

                        💸

                        </span>


                                <input type="number"
                                       class="form-control"
                                       placeholder="Enter price" name="price">

                            </div>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Quantity

                            </label>


                            <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-stack"></i>

                        </span>


                                <input type="number"
                                       class="form-control"
                                       placeholder="Enter quantity" name="qty">

                            </div>

                        </div>
                    <div class="d-flex justify-content-end gap-3 mt-5">


                        <button type="reset"
                                class="btn btn-outline-secondary reset-btn">

                            <i class="bi bi-arrow-counterclockwise me-2"></i>

                            Reset

                        </button>


                        <button type="submit"
                                class="btn btn-primary submit-btn">

                            <i class="bi bi-plus-circle me-2"></i>

                            Add Book

                        </button>


                    </div>
            </div>


        </div>
    </form>
<footer>

    © 2026 BookVault · Book Management System

</footer>
</body>
</html>
