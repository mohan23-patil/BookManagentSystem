<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* =========================
   BODY
========================= */

body {
    margin: 0;
    background: #f5f7fb;
    font-family: Arial, sans-serif;
    color: #182848;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    background: white;
    padding: 15px 35px;

    box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.06);
}

.navbar-brand {
    font-size: 25px;
    font-weight: bold;
    color: #182848;
}

.navbar-brand i {
    color: #4b6cb7;
    margin-right: 8px;
}

.dashboard-btn {
    border-radius: 10px;
    font-weight: 600;
}


/* =========================
   PAGE HEADER
========================= */

.page-header {
    background: linear-gradient(135deg, #182848, #4b6cb7);

    color: white;

    padding: 55px 20px;

    text-align: center;
}

.page-header h1 {
    font-weight: bold;
    font-size: 38px;
}

.page-header p {
    color: #e5e7eb;
    opacity: 1;
    font-size: 17px;
}


/* =========================
   SEARCH CARD
========================= */

.search-card {
    max-width: 750px;

    margin: -35px auto 40px;

    background: white;

    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10);

    position: relative;
}


/* =========================
   FOOTER
========================= */

footer {
    background: white;

    color: #6b7280;

    text-align: center;

    padding: 25px;

    font-size: 14px;

    margin-top: 225px;

    border-top: 1px solid #eef0f4;
}

footer div {
    color: #182848;
    font-weight: 600;
    margin-bottom: 5px;
}
    </style>
</head>
<body>
<nav class="navbar">

    <div class="container-fluid">

        <a class="navbar-brand"
           href="login_success.jsp">

            <i class="bi bi-book-half"></i>

            BookVault

        </a>


        <a href="login_success.jsp"
           class="btn btn-outline-primary dashboard-btn">

            <i class="bi bi-grid me-2"></i>

            Dashboard

        </a>

    </div>
</nav>
<section class="page-header">

    <h1>
        <i class="bi bi-search"></i>
        Find a Book
    </h1>

    <p>
        Search for a book using its unique Book ID
    </p>

</section>
    <form action="getById" method="post">
        <div class="container">

            <div class="search-card">

                <form>

                    <label for="bookId">
                        <i class="bi bi-upc-scan"></i>
                        Enter Book ID
                    </label>

                    <div class="input-group mt-2">

                        <input
                                type="text"
                                id="bookId"
                                name="code"
                                class="form-control search-input"
                                placeholder="Example: B001"
                                required>

                        <button
                                type="submit"
                                class="btn btn-primary search-btn">

                            <i class="bi bi-search"></i>
                            Search Book

                        </button>

                    </div>

                    <div class="form-text mt-2">
                        Enter the Book ID to view complete book details.
                    </div>

                </form>

            </div>
        </div>
    </form>
<footer>

    <div>
        <i class="bi bi-book-half"></i>
        BookVault
    </div>

    <small>
        © 2026 BookVault · Book Management System
    </small>

</footer>
</body>
</html>
